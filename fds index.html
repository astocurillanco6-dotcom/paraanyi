<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi linda pashpita</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Poppins:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at bottom, #141f13 0%, #090c09 60%, #020302 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 50px 15px;
            overflow-x: hidden;
        }

        #canvas-petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 420px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* Encabezado elegante */
        .header {
            text-align: center;
            margin-top: 5px;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-style: italic;
            background: linear-gradient(135deg, #fff59d 0%, #ffd700 50%, #f57f17 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }

        .header p {
            font-size: 0.78rem;
            color: #b0c2b0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Ramo de Flores SVG Interactivo */
        .bouquet-container {
            position: relative;
            cursor: pointer;
            padding: 5px;
        }

        .flower-art {
            width: 210px;
            height: 210px;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bouquet-container:hover .flower-art {
            transform: scale(1.06) rotate(2deg);
        }

        .bouquet-container:active .flower-art {
            transform: scale(0.95);
        }

        /* Mensaje flotante al tocar el ramo */
        .floating-sparkle-text {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff59d;
            font-size: 0.85rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            white-space: nowrap;
            text-shadow: 0 0 10px #ffd700;
            transition: all 0.6s ease;
        }

        /* Galería de Fotos - Máxima Nitidez */
        .gallery-box {
            width: 100%;
            height: 420px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 215, 0, 0.35);
            box-shadow: 0 20px 45px rgba(0,0,0,0.85);
            cursor: pointer;
            background: #080a08;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-box img {
            width: 100%;
            height: 100%;
            /* 'contain' asegura que la foto NO se deforme ni se estire */
            object-fit: contain;
            position: absolute;
            top: 0; left: 0;
            opacity: 0;
            pointer-events: none;
            /* Optimización de renderizado para evitar borrosidad */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            transition: opacity 0.6s ease-in-out;
        }

        .gallery-box img.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Capa con las letras DENTRO de la foto */
        .photo-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            padding: 25px 20px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
        }

        .photo-bar {
            width: 40px;
            height: 3px;
            background: #ffd700;
            border-radius: 2px;
            box-shadow: 0 0 8px #ffd700;
        }

        .photo-text {
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.6;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* Transiciones suaves y nitidas para las 5 Fotos (Sin efectos borrosos) */
        .anim-photo-0 { animation: fadeIn 0.8s ease forwards; }
        .anim-photo-1 { animation: slideRight 0.8s ease forwards; }
        .anim-photo-2 { animation: zoomSmooth 0.8s ease forwards; }
        .anim-photo-3 { animation: slideUp 0.8s ease forwards; }
        .anim-photo-4 { animation: fadeIn 0.8s ease forwards; }

        /* Keyframes de fotos limpias */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideRight { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes zoomSmooth { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* Keyframes para el Texto */
        .anim-text { animation: textFadeUp 0.8s ease forwards; }
        @keyframes textFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="canvas-petals"></canvas>

    <!-- Reproducción automática de música -->
    <audio id="myAudio" src="musica.mp3" autoplay loop></audio>

    <div class="container">
        
        <div class="header">
            <h1>Para mi Petunia</h1>
            <p>Pensado exclusivamente para ti</p>
        </div>

        <!-- Ramo de Flores SVG Interactivo -->
        <div class="bouquet-container" onclick="interactBouquet(event)">
            <div class="floating-sparkle-text" id="sparkleText">¡Un abrazo enorme! 💛</div>
            
            <svg class="flower-art" viewBox="0 0 240 240">
                <defs>
                    <radialGradient id="petalGold" cx="50%" cy="90%" r="90%">
                        <stop offset="0%" stop-color="#fff59d"/>
                        <stop offset="50%" stop-color="#ffd700"/>
                        <stop offset="85%" stop-color="#f57f17"/>
                        <stop offset="100%" stop-color="#e65100"/>
                    </radialGradient>
                    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#4e342e"/>
                        <stop offset="80%" stop-color="#1b0c07"/>
                    </radialGradient>
                    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#558b2f"/>
                        <stop offset="100%" stop-color="#2e7d32"/>
                    </linearGradient>
                    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="100%" stop-color="#ff8c00"/>
                    </linearGradient>
                </defs>

                <!-- TALLOS Y LAZO -->
                <g stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round">
                    <line x1="120" y1="140" x2="95" y2="215"/>
                    <line x1="120" y1="140" x2="120" y2="220"/>
                    <line x1="120" y1="140" x2="145" y2="215"/>
                </g>
                <path d="M 105,185 C 115,175 120,185 120,185 C 120,185 125,175 135,185 C 145,195 120,200 120,200 C 120,200 95,195 105,185 Z" fill="url(#ribbonGrad)" />
                <circle cx="120" cy="185" r="4" fill="#fff59d"/>

                <!-- FLOR CENTRAL -->
                <g transform="translate(120,105)">
                    <g fill="url(#petalGold)">
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(0)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(30)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(60)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(90)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(120)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(150)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(180)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(210)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(240)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(270)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(300)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(330)"/>
                    </g>
                    <circle cx="0" cy="0" r="22" fill="url(#centerGrad)" stroke="#6d4c41" stroke-width="2"/>
                </g>

                <!-- FLOR IZQUIERDA -->
                <g transform="translate(68,115) scale(0.75)">
                    <g fill="url(#petalGold)">
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(0)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(45)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(90)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(135)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(180)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(225)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(270)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(315)"/>
                    </g>
                    <circle cx="0" cy="0" r="18" fill="url(#centerGrad)"/>
                </g>

                <!-- FLOR DERECHA -->
                <g transform="translate(172,115) scale(0.75)">
                    <g fill="url(#petalGold)">
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(15)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(60)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(105)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(150)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(195)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(240)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(285)"/>
                        <path d="M 0,-10 C -7,-35 0,-65 0,-65 C 0,-65 7,-35 0,-10" transform="rotate(330)"/>
                    </g>
                    <circle cx="0" cy="0" r="18" fill="url(#centerGrad)"/>
                </g>
            </svg>
        </div>

        <!-- Galería de Fotos (Textos Limpios sobre la Imagen) -->
        <div class="gallery-box" onclick="nextSlide()">
            <img src="foto1.jpg" class="active anim-photo-0" alt="Foto 1">
            <img src="foto2.jpg" alt="Foto 2">
            <img src="foto3.jpg" alt="Foto 3">
            <img src="foto4.jpg" alt="Foto 4">
            <img src="foto5.jpg" alt="Foto 5">

            <div class="photo-overlay">
                <div class="photo-bar"></div>
                <div class="photo-text anim-text" id="photoText">
                    Aunque estemos a la distancia, hoy quería enviarte este detalle para sacarte una sonrisa y desearte un bonito día, mi Anyi.
                </div>
            </div>
        </div>

    </div>

    <script>
        // Iniciar música automáticamente con cualquier primer clic en pantalla si el navegador lo bloquea
        document.addEventListener('click', function() {
            const audio = document.getElementById('myAudio');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });

        const messages = [
            "Aunque estemos a la distancia, hoy quería enviarte este detalle para sacarte una sonrisa y desearte un bonito día, mi Anyi.",
            "Volver a ver estas fotos me hace recordar momentos geniales que pasamos juntos y que siempre da gusto volver a mirar.",
            "A pesar del día a día o los kilómetros de por medio, siempre me acuerdo de ti y quería estar presente de esta forma.",
            "Acomodé estas imágenes para ti esperando que te guste la sorpresa y sientas un abrazo fuerte desde aquí.",
            "Eres alguien muy especial para mí y solo quería recordártelo hoy con este pequeño rincón que armé para ti.",
        ];

        const sparkPhrases = [
            "¡Un abrazo enorme! 💛",
            "¡Flores para ti! 🌻",
            "¡Pensando en ti! ✨",
            "¡Eres especial! 🌟",
            "¡Sonríe hoy! 😊"
        ];

        let currentIndex = 0;
        let sparkIndex = 0;

        const photos = document.querySelectorAll('.gallery-box img');
        const photoText = document.getElementById('photoText');

        function nextSlide() {
            photos[currentIndex].className = '';
            
            currentIndex = (currentIndex + 1) % photos.length;

            photos[currentIndex].classList.add('active', `anim-photo-${currentIndex}`);

            photoText.classList.remove('anim-text');
            void photoText.offsetWidth; // Reflow para reiniciar animación
            photoText.innerText = messages[currentIndex];
            photoText.classList.add('anim-text');
        }

        function interactBouquet(e) {
            const sparkText = document.getElementById('sparkleText');
            sparkText.innerText = sparkPhrases[sparkIndex];
            sparkIndex = (sparkIndex + 1) % sparkPhrases.length;

            sparkText.style.opacity = '1';
            sparkText.style.transform = 'translate(-50%, -15px)';

            setTimeout(() => {
                sparkText.style.opacity = '0';
                sparkText.style.transform = 'translate(-50%, 0px)';
            }, 1400);

            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = rect.left + rect.width / 2;
            const clickY = rect.top + rect.height / 2;

            for (let i = 0; i < 20; i++) {
                petals.push({
                    x: clickX,
                    y: clickY,
                    size: Math.random() * 7 + 4,
                    speedY: Math.random() * 5 - 2.5,
                    speedX: Math.random() * 5 - 2.5,
                    angle: Math.random() * Math.PI * 2,
                    spin: Math.random() * 0.08 - 0.04,
                    opacity: 1
                });
            }
        }

        /* Canvas de Pétalos Flotantes */
        const canvas = document.getElementById('canvas-petals');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const petals = Array.from({ length: 28 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 6 + 4,
            speedY: Math.random() * 0.9 + 0.4,
            speedX: Math.random() * 0.5 - 0.25,
            angle: Math.random() * Math.PI * 2,
            spin: Math.random() * 0.02 - 0.01,
            opacity: Math.random() * 0.6 + 0.4
        }));

        function drawPetalShape(ctx, size) {
            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.bezierCurveTo(size * 0.8, -size * 0.5, size * 0.8, size * 0.5, 0, size);
            ctx.bezierCurveTo(-size * 0.8, size * 0.5, -size * 0.8, -size * 0.5, 0, -size);
            ctx.fill();
        }

        function drawPetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            petals.forEach((p, index) => {
                p.y += p.speedY;
                p.x += Math.sin(p.y * 0.01) * 0.4 + p.speedX;
                p.angle += p.spin;

                if (petals.length > 28 && index >= 28) {
                    p.opacity -= 0.012;
                }

                if (p.y > canvas.height + 20) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }

                if (p.opacity > 0) {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    
                    let grad = ctx.createLinearGradient(0, -p.size, 0, p.size);
                    grad.addColorStop(0, '#fff59d');
                    grad.addColorStop(0.6, '#ffd700');
                    grad.addColorStop(1, '#ff8c00');

                    ctx.fillStyle = grad;
                    ctx.globalAlpha = Math.max(0, p.opacity);
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = 'rgba(255, 215, 0, 0.3)';
                    
                    drawPetalShape(ctx, p.size);
                    ctx.restore();
                }
            });

            for (let i = petals.length - 1; i >= 28; i--) {
                if (petals[i].opacity <= 0) petals.splice(i, 1);
            }

            requestAnimationFrame(drawPetals);
        }
        drawPetals();
    </script>
</body>
</html>
